{% extends "store/base.html" %}

{% block title %}Create Account - Boighor{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-box">

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Join Boighor and start discovering great books.
        </p>

        {% if error %}
            <div class="auth-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm password"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <p class="auth-bottom">
            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
